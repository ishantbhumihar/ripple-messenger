<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password · Ripple</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="auth-view">
      <div class="brand">
        <a href="/login" class="brand-link"><span>⌁</span> ripple</a>
      </div>
      <div class="auth-card">
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Reset your password</h1>
        <p class="subtle">Enter your account email and choose a new password to regain access.</p>
        
        <form id="reset-form">
          <label>Registered Email
            <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
          </label>
          <label>Username (optional)
            <input id="username" maxlength="30" placeholder="e.g. alex_89">
            <small>If provided, confirms account ownership.</small>
          </label>
          <label>New Password
            <input id="new-password" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters">
          </label>
          <label>Confirm New Password
            <input id="confirm-password" type="password" required minlength="8" autocomplete="new-password" placeholder="Re-enter new password">
          </label>
          <button id="reset-submit" class="primary" type="submit">Reset password</button>
        </form>

        <div class="auth-sub-links">
          <a href="/login" class="back-link">‹ Back to Log in</a>
        </div>
        <p id="reset-note" class="form-note" role="alert"></p>
      </div>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script src="shared.js"></script>
  <script src="forgot-password.js"></script>
</body>
</html>
