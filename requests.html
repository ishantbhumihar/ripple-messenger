<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Requests · Ripple</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="messenger-view" class="messenger">
      <aside class="sidebar">
        <a href="/" class="brand brand-link"><span>⌁</span> ripple</a>
        <div class="me-card">
          <span id="my-avatar" class="avatar"></span>
          <div>
            <b id="my-name"></b>
            <small id="my-handle"></small>
          </div>
        </div>
        <nav>
          <a href="/" class="nav-button" data-screen="chats">⌂ <span>Messages</span></a>
          <a href="/discover" class="nav-button" data-screen="discover">⌕ <span>Discover</span></a>
          <a href="/requests" class="nav-button active" data-screen="requests">♡ <span>Requests</span><i id="request-count" hidden></i></a>
          <a href="/profile" class="nav-button" data-screen="profile">⚙ <span>Profile</span></a>
        </nav>
        <button id="logout" class="logout" type="button">↪ Log out</button>
        <div class="privacy-note">
          ◈ <span><b>Private by design</b><small>One person at a time. No groups.</small></span>
        </div>
      </aside>

      <section class="content">
        <section class="screen">
          <header class="screen-header">
            <div>
              <p class="eyebrow">REQUESTS</p>
              <h2>Decide who can message you</h2>
            </div>
          </header>
          <div id="request-list" class="list"></div>
        </section>
      </section>
    </section>
  </main>
  <div id="toast" hidden></div>
  <script src="shared.js"></script>
  <script src="requests.js"></script>
</body>
</html>
